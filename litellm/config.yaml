model_list:
  # ==========================================================================
  # "coder" group — code models, load-balanced across Mistral + Cloudflare
  # ==========================================================================
  - model_name: "coder"
    litellm_params:
      model: "mistral/codestral-latest"
      api_key: "${MISTRAL_API_KEY}"
  - model_name: "coder"
    litellm_params:
      model: "openai/@cf/qwen/qwen2.5-coder-32b-instruct"
      api_key: "${CLOUDFLARE_API_KEY}"
      api_base: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"

  # ==========================================================================
  # "large" group — strong reasoning, Mistral + Vercel Gateway (Claude/GPT)
  # ==========================================================================
  - model_name: "large"
    litellm_params:
      model: "mistral/mistral-large-latest"
      api_key: "${MISTRAL_API_KEY}"
  - model_name: "large"
    litellm_params:
      model: "openai/anthropic/claude-sonnet-4"
      api_key: "${AI_GATEWAY_API_KEY}"
      api_base: "https://ai-gateway.vercel.sh/v1"

  # ==========================================================================
  # "fast" group — cheap/fast, Mistral Small + Cloudflare Llama
  # ==========================================================================
  - model_name: "fast"
    litellm_params:
      model: "mistral/mistral-small-latest"
      api_key: "${MISTRAL_API_KEY}"
  - model_name: "fast"
    litellm_params:
      model: "openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      api_key: "${CLOUDFLARE_API_KEY}"
      api_base: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"

router_settings:
  routing_strategy: "least-busy"
  num_retries: 2
  fallbacks:
    - { "coder": ["large"] }
    - { "large": ["coder"] }
    - { "fast": ["coder"] }
