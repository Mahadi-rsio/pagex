services:
  # ============================================================================
  # API Service — Express Backend
  # ============================================================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3001/api/auth/jwks}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Blob Server — Caddy with static_s3 Plugin
  # ============================================================================
  blob-server:
    build:
      context: ./services/blob-server
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "3080:3080"
      - "2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_BUCKET=${MINIO_BUCKET:-sites}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - REDIRECT_TO_S3=${REDIRECT_TO_S3:-false}
      - PRESIGN_REDIRECT=${PRESIGN_REDIRECT:-false}
      - PRESIGN_LIFETIME=${PRESIGN_LIFETIME:-15m}
      - CACHE_TTL=${CACHE_TTL:-2m}
      - CACHE_SIZE=${CACHE_SIZE:-1000}
      - MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-512KiB}
    depends_on:
      api:
        condition: service_started
      console:
        condition: service_started
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Console — Next.js Standalone (port 3001)
  # ============================================================================
  console:
    build:
      context: ./services/console
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    expose:
      - "3001"
    depends_on:
      console-migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # Database Migrator — API Service
  # ============================================================================
  migrator:
    build:
      context: ./services/api
      target: migrator
    env_file: .env
    environment:
      - DRIZZLE_CONNECTION=${DIRECT_DB:-postgresql://postgres:postgres@db:5432/pagex}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - pagex

  # ============================================================================
  # Database Migrator — Console Service
  # ============================================================================
  console-migrator:
    build:
      context: ./services/console
      dockerfile: Dockerfile
      target: migrator
    env_file: .env
    environment:
      - DATABASE_URL=${NEXT_WEB_DATABASE_URL:-${DIRECT_DB:-postgresql://postgres:postgres@db:5432/pagex}}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - pagex

  # ============================================================================
  # Build Environment — For Cloud Builds (profile: workers)
  # ============================================================================
  build-env:
    build:
      context: ./services/api
      target: build-env
    image: pagex-build-env:latest
    pull_policy: build
    restart: "no"
    command: ["sh", "-c", "echo 'pagex-build-env ready'"]
    networks:
      - pagex

  # ============================================================================
  # Sync Worker — Usage Analytics (profile: workers)
  # ============================================================================
  sync-worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3001/api/auth/jwks}
    command: ["node", "dist/queue/workers/sync.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Build Worker — Cloud Builds (profile: workers)
  # ============================================================================
  build-worker:
    build:
      context: ./services/api
      target: build-worker
    env_file: .env
    environment:
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3001/api/auth/jwks}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/cloudisy-builds:/tmp/cloudisy-builds
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      build-env:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pagex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pagex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Redis — Cache and Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pagex

volumes:
  pgdata:

networks:
  pagex:
    driver: bridge
