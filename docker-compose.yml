# ============================================================================
# PageX — local Docker Compose
#
# Docker runs the blob-server (Caddy + static_s3) and the Vector access-log
# pipeline only. The console runs on Vercel (serverless) and the datastore is
# managed: Neon (Postgres) + Upstash (Redis). Nothing here runs the console.
#
# Usage (from repo root):
#   cp .env.example .env     # first run, then fill in required values
#   docker compose up -d
# ============================================================================

name: pagex

services:
  # ============================================================================
  # Blob Server — Caddy with static_s3 Plugin
  # ============================================================================
  blob-server:
    container_name: caddy
    image: ghcr.io/mahadi-rsio/pagex/blob-server:latest
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_BUCKET=${MINIO_BUCKET:-sites}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      # Neon Postgres connection string. The static_s3 plugin only performs
      # read-only site lookups, so the pooled endpoint is fine.
      - DATABASE_URL=${DATABASE_URL}
      # Console origin the console host blocks reverse-proxy to.
      - CONSOLE_UPSTREAM=${CONSOLE_UPSTREAM:-http://localhost:3000}
      - REDIRECT_TO_S3=${REDIRECT_TO_S3:-false}
      - PRESIGN_REDIRECT=${PRESIGN_REDIRECT:-false}
      - PRESIGN_LIFETIME=${PRESIGN_LIFETIME:-15m}
      - CACHE_TTL=${CACHE_TTL:-2m}
      - CACHE_SIZE=${CACHE_SIZE:-1000}
      - MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-512KiB}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - TLS_CFG=${TLS_CFG:-tls-off}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/blob-server/tls:/etc/caddy/tls:ro
      - caddy_logs:/var/log/caddy
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Vector — access-log aggregation → console usage ingest
  # ============================================================================
  vector:
    container_name: vector
    image: timberio/vector:0.46.1-alpine
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./services/blob-server/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - caddy_logs:/var/log/caddy
      - vector_data:/var/lib/vector
    environment:
      - USAGE_INGEST_TOKEN=${USAGE_INGEST_TOKEN}
      - USAGE_API_URL=${USAGE_API_URL:-http://localhost:3000/internal/usage/ingest}
    depends_on:
      - blob-server
    restart: unless-stopped
    networks:
      - pagex

volumes:
  caddy_logs:
  vector_data:

networks:
  pagex:
    driver: bridge
