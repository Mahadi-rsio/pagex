version: "3.9"
services:
  app:
    build: .
    container_name: express_app
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - DB=postgresql://postgres:postgres@db:5432/mydb
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - minio
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: log_worker
    command: ["node", "dist/src/queue/worker/worker.js"]
    depends_on:
      - redis
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy_server
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy    # 👈 log volume
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio
    container_name: minio_server
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server
    expose:
      - "6379"
    restart: unless-stopped

  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: vector
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - caddy_logs:/var/log/caddy:ro          # caddy log পড়বে
      - ./config/vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      - caddy
      - app
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  caddy_logs:    # 👈 shared between caddy + vector
