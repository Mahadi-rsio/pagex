services:
  # ============================================================================
  # Blob Server — Caddy with static_s3 Plugin
  # ============================================================================
  blob-server:
    container_name: caddy
    image: ghcr.io/mahadi-rsio/pagex/blob-server:latest
    ports:
      - "80:80"
      - "443:443"
      - "3080:3080"
      - "2019:2019"
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_BUCKET=${MINIO_BUCKET:-sites}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - REDIRECT_TO_S3=${REDIRECT_TO_S3:-false}
      - PRESIGN_REDIRECT=${PRESIGN_REDIRECT:-false}
      - PRESIGN_LIFETIME=${PRESIGN_LIFETIME:-15m}
      - CACHE_TTL=${CACHE_TTL:-2m}
      - CACHE_SIZE=${CACHE_SIZE:-1000}
      - MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-512KiB}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - TLS_CFG=${TLS_CFG:-tls-off}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/blob-server/tls:/etc/caddy/tls:ro
      - caddy_logs:/var/log/caddy
    depends_on:
      console:
        condition: service_started
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Vector — access-log aggregation → API ingest
  # ============================================================================
  vector:
    container_name: vector
    image: timberio/vector:0.46.1-alpine
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./services/blob-server/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - caddy_logs:/var/log/caddy
      - vector_data:/var/lib/vector
    environment:
      - USAGE_INGEST_TOKEN=${USAGE_INGEST_TOKEN}
      - USAGE_API_URL=${USAGE_API_URL:-http://console:3001/internal/usage/ingest}
    depends_on:
      console:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Console — Next.js Standalone (port 3001)
  # ============================================================================
  console:
    container_name: web
    build:
      context: ./services/console/
      dockerfile: Dockerfile
    
    env_file: .env
    environment:
      - DATABASE_URL=${NEXT_WEB_DATABASE_URL:-${DIRECT_DB:-postgresql://postgres:postgres@db:5432/pagex}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pagex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pagex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Redis — Cache, rate limiting, and deploy locks
  # ============================================================================
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pagex

volumes:
  pgdata:
  caddy_logs:
  vector_data:

networks:
  pagex:
    driver: bridge
