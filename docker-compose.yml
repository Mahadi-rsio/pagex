# ============================================================================
# PageX — local Docker Compose
#
# Docker runs the blob-server (Caddy + static_s3) only. The console runs on
# Vercel (serverless) and the datastore is managed: Neon (Postgres) + Upstash
# (Redis). Nothing here runs the console. Usage/metrics aggregation is done
# in-process by the static_s3 plugin's usage tracker (no Vector container).
#
# Usage (from repo root):
#   cp .env.example .env     # first run, then fill in required values
#   docker compose up -d
# ============================================================================

name: pagex

services:
  # ============================================================================
  # Blob Server — Caddy with static_s3 Plugin
  # ============================================================================
  blob-server:
    container_name: caddy
    image: ghcr.io/mahadi-rsio/pagex/blob-server:${PAGEX_VERSION:-latest}
    build:
      context: ./services/blob-server
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_BUCKET=${MINIO_BUCKET:-sites}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      # Neon Postgres connection string. The static_s3 plugin only performs
      # read-only site lookups, so the pooled endpoint is fine.
      - DATABASE_URL=${DATABASE_URL}
      # Upstash Redis (REST) durable routing lookup: subdomain → site_id and
      # site_id → active deployment. Optional locally; when unset the plugin
      # falls back to Neon and warms the process-local LRU.
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-px}
      # Console origin the console host blocks reverse-proxy to.
      - CONSOLE_UPSTREAM=${CONSOLE_UPSTREAM:-http://localhost:3000}
      - REDIRECT_TO_S3=${REDIRECT_TO_S3:-false}
      - PRESIGN_REDIRECT=${PRESIGN_REDIRECT:-false}
      - PRESIGN_LIFETIME=${PRESIGN_LIFETIME:-15m}
      - CACHE_TTL=${CACHE_TTL:-2m}
      - CACHE_SIZE=${CACHE_SIZE:-1000}
      - MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-512KiB}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - TLS_CFG=${TLS_CFG:-tls-off}
      # In-process usage tracker (replaces the removed Vector container). The
      # plugin tails its own access log and POSTs usage to the console ingest
      # endpoint. Only starts when USAGE_INGEST_TOKEN is set.
      - USAGE_INGEST_TOKEN=${USAGE_INGEST_TOKEN:-}
      - USAGE_API_URL=${USAGE_API_URL:-http://localhost:3000/internal/usage/ingest}
      - USAGE_LOG_PATH=${USAGE_LOG_PATH:-/var/log/caddy/access.log}
      - USAGE_LOG_DIR=${USAGE_LOG_DIR:-/var/log/caddy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/blob-server/tls:/etc/caddy/tls:ro
      - caddy_logs:/var/log/caddy
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Worker — REMOVED
  # ============================================================================
  # The Go worker (`services/worker`) has been deleted and replaced by the
  # `cleanup-worker` Cloudflare Worker (push consumer on `pagex-background`).
  # Cleanup now runs on Cloudflare — there is no local worker container.
  # See `cleanup-worker/README.md`.

volumes:
  caddy_logs:

networks:
  pagex:
    driver: bridge
