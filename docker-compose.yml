services:
  # ============================================================================
  # API Service — Express Backend
  # ============================================================================
  api:
    container_name: api
    build:
      context: ./services/api/
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3001/api/auth/jwks}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Blob Server — Caddy with static_s3 Plugin
  # ============================================================================
  blob-server:
    container_name: caddy
    image: ghcr.io/mahadi-rsio/pagex/blob-server:latest
    ports:
      - "80:80"
      - "443:443"
      - "3080:3080"
      - "2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/blob-server/tls:/etc/caddy/tls:ro
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_BUCKET=${MINIO_BUCKET:-sites}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - REDIRECT_TO_S3=${REDIRECT_TO_S3:-false}
      - PRESIGN_REDIRECT=${PRESIGN_REDIRECT:-false}
      - PRESIGN_LIFETIME=${PRESIGN_LIFETIME:-15m}
      - CACHE_TTL=${CACHE_TTL:-2m}
      - CACHE_SIZE=${CACHE_SIZE:-1000}
      - MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-512KiB}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - TLS_CFG=${TLS_CFG:-tls-off}
    depends_on:
      api:
        condition: service_started
      console:
        condition: service_started
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Console — Next.js Standalone (port 3001)
  # ============================================================================
  console:
    container_name: web
    build:
      context: ./services/console/
      dockerfile: Dockerfile
    
    env_file: .env
    environment:
      - DATABASE_URL=${NEXT_WEB_DATABASE_URL:-${DIRECT_DB:-postgresql://postgres:postgres@db:5432/pagex}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - EXPRESS_URL=${NEXT_PUBLIC_API_URL:-http://api:3000}
    expose:
      - "3001"
    depends_on:
      console-migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # Database Migrator — Console Service
  # ============================================================================
  console-migrator:
    build:
      context: ./services/console
      dockerfile: Dockerfile
      target: migrator
    pull_policy: build
    env_file: .env
    environment:
      - DATABASE_URL=${NEXT_WEB_DATABASE_URL:-${DIRECT_DB:-postgresql://postgres:postgres@db:5432/pagex}}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - pagex

  # ============================================================================
  # Build Environment — For Cloud Builds (profile: workers)
  # ============================================================================
  build-env:
    container_name: builder
    build:
      context: ./services/api
      target: build-env
    image: pagex-build-env:latest
    pull_policy: build
    restart: "no"
    command: ["sh", "-c", "echo 'pagex-build-env ready'"]
    networks:
      - pagex

  # ============================================================================
  # Build Worker — Cloud Builds (profile: workers)
  # ============================================================================
  build-worker:
    container_name: build_w
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: build-worker
    image: ghcr.io/mahadi-rsio/pagex/api-build-worker:latest
    pull_policy: build
    env_file: .env
    environment:
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3001/api/auth/jwks}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Point the build worker at the ISOLATED dind daemon over TCP, never the
      # host socket. This is the key hardening step: a compromised tenant build
      # can only ever reach the sandbox daemon, not control the host Docker daemon.
      - DOCKER_HOST=tcp://docker-dind:2375
      - BUILD_ENV_IMAGE=pagex-build-env:latest
      - BUILD_SECCOMP_PROFILE=/etc/seccomp/build.json
      - BUILD_MAX_CONCURRENT_PER_TENANT=${BUILD_MAX_CONCURRENT_PER_TENANT:-2}
    command: ["node","dist/queue/workers/build.worker.js"]
    volumes:
      - build-shared:/tmp/cloudisy-builds
      - ./services/api/seccomp.build.json:/etc/seccomp/build.json:ro
    depends_on:
      redis:
        condition: service_healthy
      build-env:
        condition: service_completed_successfully
      docker-dind:
        condition: service_started
    restart: unless-stopped
    networks:
      - pagex
      - build-net

  # ============================================================================
  # Isolated Docker daemon — Cloud Builds sandbox
  # The build worker talks to THIS daemon over TCP (tcp://docker-dind:2375) on
  # the isolated build-net, never the host. All tenant build containers run
  # inside this dind, so a container escape cannot reach the host daemon or host
  # root. The daemon's socket is NOT shared with any other container.
  # ============================================================================
  docker-dind:
    container_name: build_dind
    image: docker:${DOCKER_DIND_TAG:-27}-dind
    privileged: true
    # privileged is required for DinD (nested namespaces/overlay). It is bounded:
    # the daemon listens only on build-net (tcp:2375), is never published to the
    # host, and compromise of a build container reaches this disposable daemon,
    # not the host. Trade-off: nested-DinD must run privileged.
    environment:
      - DOCKER_TLS_CERTDIR=
      - DOCKER_HOST=tcp://0.0.0.0:2375
      - DOCKER_DRIVER=overlay2
    volumes:
      - docker-data:/var/lib/docker
      - build-shared:/tmp/cloudisy-builds
      - ./services/api/seccomp.build.json:/etc/seccomp/build.json:ro
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    networks:
      - build-net
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pagex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pagex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Redis — Cache and Queue
  # ============================================================================
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pagex

volumes:
  pgdata:
  # Isolated dind data so the host daemon is never exposed.
  docker-data:
  build-shared:

networks:
  pagex:
    driver: bridge
  # Isolated network for the sandbox daemon + build worker. Tenant build
  # containers run with --network none, and the daemon itself cannot reach the
  # main pagex network (no link between build-net and pagex).
  build-net:
    driver: bridge
