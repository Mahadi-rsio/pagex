# Cloudisy — Docker Compose
#
# Services: app API, build/sync workers, Postgres, Redis, Caddy (static_s3 + console),
# next-web console API (GHCR image; static UI served by the same Caddy on :3080).
# MinIO is external (MINIO_ENDPOINT_URL) — not run in this compose file.
#
# Serving path (blob-direct):
#   Caddy → Redis site:{subdomain} → site_files:{site_id} path→hash → MinIO blobs/{hash}
#
# Console (next-web):
#   next_web_migrator → Better Auth tables; caddy_server :3080 → static + /api/* → next_web
#   Express verifies JWTs via AUTH_JWKS_URL → next_web:3000/api/auth/jwks
#
# Host-side scripts (tsx / test.js): Redis is published on localhost:6379.
# Compose services set IN_DOCKER_COMPOSE=1 so REDIS_URL keeps hostname `redis`.

services:
  # Pre-builds the pnpm image used by the build worker for cloud builds.
  # `docker compose up --build` tags cloudisy-build-env:latest on the host.
  build_env:
    build:
      context: .
      target: build-env
    image: cloudisy-build-env:latest
    restart: "no"
    command: ["sh", "-c", "echo 'cloudisy-build-env ready'"]

  migrator:
    build:
      context: .
      target: migrator
    container_name: drizzle_migrator
    env_file: .env
    environment:
      # Use the in-network DB host (not localhost from host-side DRIZZLE_CONNECTION)
      DRIZZLE_CONNECTION: ${DIRECT_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - cloudisy_network

  app:
    build:
      context: .
      target: runner
    container_name: express_app
    env_file: .env
    environment:
      IN_DOCKER_COMPOSE: "1"
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://next_web:3000/api/auth/jwks}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudisy_network

  sync_worker:
    build:
      context: .
      target: runner
    container_name: sync_w
    env_file: .env
    environment:
      IN_DOCKER_COMPOSE: "1"
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://next_web:3000/api/auth/jwks}
    command: ["node", "dist/src/queue/workers/sync.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudisy_network

  build_worker:
    build:
      context: .
      target: build-worker
    container_name: build_w
    env_file: .env
    environment:
      IN_DOCKER_COMPOSE: "1"
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://next_web:3000/api/auth/jwks}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      build_env:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/cloudisy-builds:/tmp/cloudisy-builds
    networks:
      - cloudisy_network

  caddy:
    image: ghcr.io/mahadi-rsio/cdx_s3:latest
    container_name: caddy_server
    env_file: .env
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DATABASE_URL: ${DB}?sslmode=disable
      REDIS_URL: ${REDIS_URL}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL}
    ports:
      - "80:80"
      - "443:443"
      - "3080:3080"
      - "2019:2019"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/next-web/caddy:/etc/caddy/caddy:ro
      - ./certs/cert.pem:/etc/caddy/certs/cert.pem:ro
      - ./certs/key.pem:/etc/caddy/certs/key.pem:ro
      - next_web_static:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
      next_web:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: always
    networks:
      - cloudisy_network

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    env_file: .env
    ports:
      - "6432:6432"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${POSTGRES_USER}
      AUTH_QUERY: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_RESET_QUERY: ""
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - cloudisy_network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - cloudisy_network

  # next-web Better Auth schema (user, session, jwks, …). Separate migrations table.
  next_web_migrator:
    build:
      context: ./config/next-web
      dockerfile: Dockerfile.migrator
    container_name: next_web_migrator
    environment:
      DATABASE_URL: ${NEXT_WEB_DATABASE_URL:-${DIRECT_DB}}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - cloudisy_network

  # next-web console (static UI + Better Auth API). Image: runner stage only.
  next_web:
    image: ghcr.io/mahadi-rsio/next-web:latest
    container_name: next_web
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${NEXT_WEB_DATABASE_URL:-${DIRECT_DB}}
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3080}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3080}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      ENABLE_EMAIL_PASSWORD: ${ENABLE_EMAIL_PASSWORD:-true}
      NEXT_PUBLIC_ENABLE_EMAIL_PASSWORD: ${NEXT_PUBLIC_ENABLE_EMAIL_PASSWORD:-true}
    volumes:
      - next_web_static:/shared/static
    expose:
      - "3000"
    depends_on:
      next_web_migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudisy_network

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  next_web_static:

networks:
  cloudisy_network:
    driver: bridge
