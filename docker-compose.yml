services:
  # Pre-builds the pnpm image used by the build worker for cloud builds.
  # Running `docker compose up --build` will tag cloudisy-build-env:latest
  # on the host, which build_w can then use via the mounted Docker socket.
  build_env:
    build:
      context: .
      target: build-env
    image: cloudisy-build-env:latest
    restart: "no"
    command: ["sh", "-c", "echo 'cloudisy-build-env ready'"]

  migrator:
    build:
      context: .
      target: migrator
    container_name: drizzle_migrator
    env_file: .env
    environment:
      # Use the in-network DB host (not localhost from host-side DRIZZLE_CONNECTION)
      DRIZZLE_CONNECTION: ${DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - cloudisy_network

  app:
    build:
      context: .
      target: runner
    container_name: express_app
    env_file: .env
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips
    networks:
      - cloudisy_network

  upload_worker:
    build:
      context: .
      target: runner
    container_name: upload_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/upload.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips
    networks:
      - cloudisy_network

  sync_worker:
    build:
      context: .
      target: runner
    container_name: sync_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/sync.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cloudisy_network

  build_worker:
    build:
      context: .
      target: build-worker
    container_name: build_w
    env_file: .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with the host so `docker run -v /tmp/cloudisy-builds/...` works
      # (Docker socket connects to the host daemon, which needs to see these paths)
      - /tmp/cloudisy-builds:/tmp/cloudisy-builds
    networks:
      - cloudisy_network

  caddy:
    image: ghcr.io/mahadi-rsio/cdx_s3:latest
    container_name: caddy_server
    env_file: .env
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DATABASE_URL: ${DB}?sslmode=disable
      REDIS_URL: ${REDIS_URL}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL}
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      # Local: dummy self-signed in certs/. Prod: replace with Cloudflare Origin CA files.
      - ./certs/cert.pem:/etc/caddy/certs/cert.pem:ro
      - ./certs/key.pem:/etc/caddy/certs/key.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: always
    networks:
      - cloudisy_network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - cloudisy_network


volumes:
  pgdata:
  caddy_data:
  caddy_config:
  temp_zips:

networks:
  cloudisy_network:
    driver: bridge
