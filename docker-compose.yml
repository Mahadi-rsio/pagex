services:
  app:
    build: .
    container_name: express_app
    env_file: .env
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - db
      - minio
      - redis
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips
    networks:
      - cloudisy_network

  upload_worker:
    build: .
    container_name: upload_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/upload.worker.js"]
    depends_on:
      - redis
      - db
    restart: unless-stopped
    volumes:
      - temp_zips:/app/temp_zips
    networks:
      - cloudisy_network

  log_worker:
    build: .
    container_name: log_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/log.worker.js"]
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - cloudisy_network

  sync_worker:
    build: .
    container_name: sync_w
    env_file: .env
    command: ["node", "dist/src/queue/workers/sync.worker.js"]
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - cloudisy_network

  caddy:
    build:
      context: ./plugins
      dockerfile: Dockerfile
    container_name: caddy_server
    env_file: .env
    environment:
      # DATABASE_URL and REDIS_URL are read directly by the static_s3 plugin
      # (no Caddyfile directive needed — see plugin.go Provision()).
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      DATABASE_URL: ${DB}?sslmode=disable
      REDIS_URL: ${REDIS_URL}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - db
      - redis
      - minio
      - app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudisy_network

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - cloudisy_network

  minio:
    image: minio/minio
    container_name: minio_server
    env_file: .env
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
    restart: always
    networks:
      - cloudisy_network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - cloudisy_network

  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: vector
    env_file: .env
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - caddy_logs:/var/log/caddy:ro
      - ./config/vector.toml:/etc/vector/vector.toml:ro
      - vector_data:/var/lib/vector
    depends_on:
      - caddy
      - app
    restart: unless-stopped
    networks:
      - cloudisy_network

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  vector_data:
  temp_zips:
  caddy_logs:

networks:
  cloudisy_network:
    driver: bridge
