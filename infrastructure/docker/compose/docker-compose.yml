# PageX - Docker Compose Configuration
# Multi-service architecture with Nix support
#
# Services:
#   - api: Main Express backend (TypeScript)
#   - blob-server: Caddy with static_s3 plugin (Go)
#   - console: Next.js web interface
#   - db: PostgreSQL database
#   - redis: Redis cache and queue
#   - pgbouncer: PostgreSQL connection pooler
#
# MinIO is external (configure MINIO_ENDPOINT_URL)
#
# Core stack (default): db redis pgbouncer migrator console-migrator api console blob-server
# Workers (profile "workers"): sync-worker build-worker build-env
#   pnpm docker:up -- --profile workers

x-nix: &nix
  volumes:
    - nix-store:/nix/store:ro
  environment:
    - NIX_STORE_DIR=/nix/store

services:
  # ============================================================================
  # API Service - Main Express Backend
  # ============================================================================
  api:
    <<: *nix
    build:
      context: ../../../services/api
      dockerfile: Dockerfile
    container_name: pagex_api
    env_file: ../../../infrastructure/configs/.env
    environment:
      - NODE_ENV=production
      - IN_DOCKER_COMPOSE=1
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3000/api/auth/jwks}
      - DATABASE_URL=${DB:-postgresql://postgres:postgres@db:5432/pagex}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Blob Server - Caddy with static_s3 Plugin
  # ============================================================================
  blob-server:
    <<: *nix
    build:
      context: ../../../services/blob-server
      dockerfile: Dockerfile
    container_name: pagex_blob_server
    env_file: ../../../infrastructure/configs/.env
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - DATABASE_URL=${DB:-postgresql://postgres:postgres@db:5432/pagex}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - CACHE_TTL=${CACHE_TTL:-10m}
      - CACHE_SIZE=${CACHE_SIZE:-2000}
      - MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-5MB}
      - REDIRECT_TO_S3=${REDIRECT_TO_S3:-false}
      - PRESIGN_REDIRECT=${PRESIGN_REDIRECT:-false}
      - PRESIGN_LIFETIME=${PRESIGN_LIFETIME:-15m}
    ports:
      - "80:80"
      - "443:443"
      - "3080:3080"
      - "2019:2019"
    volumes:
      - ../../../infrastructure/configs/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../../infrastructure/configs/config/next-web/caddy:/etc/caddy/caddy:ro
      - ../../../infrastructure/certs/cert.pem:/etc/caddy/certs/cert.pem:ro
      - ../../../infrastructure/certs/key.pem:/etc/caddy/certs/key.pem:ro
      - next_web_static:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      console:
        condition: service_started
    restart: unless-stopped
    networks:
      - pagex_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Console - Next.js Web Interface
  # ============================================================================
  console:
    <<: *nix
    build:
      context: ../../../services/console
      dockerfile: Dockerfile
    container_name: pagex_console
    env_file: ../../../infrastructure/configs/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${NEXT_WEB_DATABASE_URL:-${DB:-postgresql://postgres:postgres@db:5432/pagex}}
      - REDIS_URL=redis://redis:6379
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3080}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3001,http://localhost:3080}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      - ENABLE_EMAIL_PASSWORD=${ENABLE_EMAIL_PASSWORD:-true}
      - NEXT_PUBLIC_ENABLE_EMAIL_PASSWORD=${NEXT_PUBLIC_ENABLE_EMAIL_PASSWORD:-true}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SENDER=${SENDER}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SMS_TOKEN=${SMS_TOKEN}
    volumes:
      - next_web_static:/shared/static
    expose:
      - "3000"
    ports:
      - "3001:3000"
    depends_on:
      console-migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # Database Migrator - API Service
  # ============================================================================
  migrator:
    <<: *nix
    build:
      context: ../../../services/api
      target: migrator
    container_name: pagex_migrator
    env_file: ../../../infrastructure/configs/.env
    environment:
      - DRIZZLE_CONNECTION=${DIRECT_DB:-postgresql://postgres:postgres@db:5432/pagex}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - pagex_network

  # ============================================================================
  # Database Migrator - Console Service (Better Auth)
  # ============================================================================
  console-migrator:
    <<: *nix
    build:
      context: ../../../services/console
      dockerfile: Dockerfile
      target: migrator
    container_name: pagex_console_migrator
    env_file: ../../../infrastructure/configs/.env
    environment:
      - DATABASE_URL=${NEXT_WEB_DATABASE_URL:-${DIRECT_DB:-postgresql://postgres:postgres@db:5432/pagex}}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - pagex_network

  # ============================================================================
  # Build Environment - For Cloud Builds (profile: workers)
  # ============================================================================
  build-env:
    <<: *nix
    profiles: ["workers"]
    build:
      context: ../../../services/api
      target: build-env
    image: pagex-build-env:latest
    pull_policy: build
    container_name: pagex_build_env
    restart: "no"
    command: ["sh", "-c", "echo 'pagex-build-env ready'"]
    networks:
      - pagex_network

  # ============================================================================
  # Sync Worker - Usage Analytics (profile: workers)
  # ============================================================================
  sync-worker:
    <<: *nix
    profiles: ["workers"]
    build:
      context: ../../../services/api
      dockerfile: Dockerfile
      target: runner
    container_name: pagex_sync_worker
    env_file: ../../../infrastructure/configs/.env
    environment:
      - IN_DOCKER_COMPOSE=1
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3000/api/auth/jwks}
    command: ["node", "dist/queue/workers/sync.worker.js"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pagex_network

  # ============================================================================
  # Build Worker - Cloud Builds (profile: workers)
  # ============================================================================
  build-worker:
    <<: *nix
    profiles: ["workers"]
    build:
      context: ../../../services/api
      target: build-worker
    container_name: pagex_build_worker
    env_file: ../../../infrastructure/configs/.env
    environment:
      - IN_DOCKER_COMPOSE=1
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://console:3000/api/auth/jwks}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/cloudisy-builds:/tmp/cloudisy-builds
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      build-env:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - pagex_network

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: pagex_db
    env_file: ../../../infrastructure/configs/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-pagex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: always
    networks:
      - pagex_network

  # ============================================================================
  # PgBouncer - Connection Pooler
  # ============================================================================
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pagex_pgbouncer
    env_file: ../../../infrastructure/configs/.env
    ports:
      - "6432:6432"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-pagex}
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - AUTH_USER=${POSTGRES_USER:-postgres}
      - AUTH_QUERY=SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
      - SERVER_RESET_QUERY=
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,options
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - pagex_network

  # ============================================================================
  # Redis - Cache and Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: pagex_redis
    command: redis-server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - pagex_network

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  next_web_static:
  nix-store:

networks:
  pagex_network:
    driver: bridge
