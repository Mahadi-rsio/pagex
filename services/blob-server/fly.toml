# PageX blob-server — Fly.io configuration
#
# Runs the custom Caddy binary (static_s3 plugin + in-process usage tracker).
# Caddy serves tenant sites on :80 (HTTP, TLS off — Cloudflare handles TLS in
# front). Scale-to-zero: the machine stops when idle and starts on request.
#
# Secrets are set via `fly secrets set` (never baked into the image):
#   S3_ACCESS_KEY S3_SECRET_KEY MINIO_ENDPOINT_URL MINIO_BUCKET
#   DATABASE_URL UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN REDIS_KEY_PREFIX
#   BASE_DOMAIN CONSOLE_UPSTREAM USAGE_INGEST_TOKEN USAGE_API_URL
#   CLOUDFLARE_API_TOKEN TLS_CFG

app = "pagex-blob-server"
primary_region = "sin"

# Pre-built image pushed to the Fly registry (services/blob-server/Dockerfile.fly).
image = "registry.fly.io/pagex-blob-server:latest"

[env]
  # Caddy writes its access log here; the in-process usage tracker tails it.
  USAGE_LOG_PATH = "/var/log/caddy/access.log"
  USAGE_LOG_DIR = "/var/log/caddy"

[http_service]
  internal_port = 80
  force_https = false
  processes = ["app"]
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
