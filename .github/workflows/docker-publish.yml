name: Docker Publish to GHCR

on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force-push:
        description: 'Force push all images even if no changes'
        required: false
        default: 'false'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        service: [api, console, blob-server]
        include:
          - service: api
            context: services/api
            dockerfile: services/api/Dockerfile
            image_name: ${{ github.repository }}/api
          - service: console
            context: services/console
            dockerfile: services/console/Dockerfile
            image_name: ${{ github.repository }}/console
          - service: blob-server
            context: services/blob-server
            dockerfile: services/blob-server/Dockerfile
            image_name: ${{ github.repository }}/blob-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Multi-arch build for production tags
  build-multi-arch:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        service: [api, console, blob-server]
        include:
          - service: api
            context: services/api
            dockerfile: services/api/Dockerfile
            image_name: ${{ github.repository }}/api
          - service: console
            context: services/console
            dockerfile: services/console/Dockerfile
            image_name: ${{ github.repository }}/console
          - service: blob-server
            context: services/blob-server
            dockerfile: services/blob-server/Dockerfile
            image_name: ${{ github.repository }}/blob-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push multi-arch
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
