name: Publish API & Workers to GHCR

on:
  push:
    tags:
      - "api/v*"

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push API images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive semver from tag
        id: tag
        run: |
          RAW="${{ github.ref_name }}"
          VERSION="${RAW#api/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 1. API Express Server (target: runner)
      # ---------------------------------------------------------
      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}
            type=sha,prefix=sha-

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          target: runner
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api-runner
          cache-to: type=gha,mode=max,scope=api-runner

      # ---------------------------------------------------------
      # 2. Build Worker (target: build-worker)
      # ---------------------------------------------------------
      - name: Extract metadata for Build Worker
        id: meta-build-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/api-build-worker
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}
            type=sha,prefix=sha-

      - name: Build & Push Build Worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          target: build-worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-build-worker.outputs.tags }}
          labels: ${{ steps.meta-build-worker.outputs.labels }}
          cache-from: type=gha,scope=api-build-worker
          cache-to: type=gha,mode=max,scope=api-build-worker

      # ---------------------------------------------------------
      # 3. Build Env Base Image (target: build-env)
      # ---------------------------------------------------------
      - name: Extract metadata for Build Env
        id: meta-build-env
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/api-build-env
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}
            type=sha,prefix=sha-

      - name: Build & Push Build Env
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          target: build-env
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-build-env.outputs.tags }}
          labels: ${{ steps.meta-build-env.outputs.labels }}
          cache-from: type=gha,scope=api-build-env
          cache-to: type=gha,mode=max,scope=api-build-env

      # ---------------------------------------------------------
      # 4. Migrator (target: migrator)
      # ---------------------------------------------------------
      - name: Extract metadata for Migrator
        id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/api-migrator
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}
            type=sha,prefix=sha-

      - name: Build & Push Migrator
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          target: migrator
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha,scope=api-migrator
          cache-to: type=gha,mode=max,scope=api-migrator

      - name: Write job summary
        run: |
          echo "### ✅ API & Worker Images Published to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Target | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.REPO }}/api\` | \`runner\` | \`${{ steps.tag.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.REPO }}/api-build-worker\` | \`build-worker\` | \`${{ steps.tag.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.REPO }}/api-build-env\` | \`build-env\` | \`${{ steps.tag.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.REPO }}/api-migrator\` | \`migrator\` | \`${{ steps.tag.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
