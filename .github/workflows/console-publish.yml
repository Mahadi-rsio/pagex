name: Publish console to GHCR

on:
  push:
    tags:
      - "console/v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/console

jobs:
  build-and-push:
    name: Build & push console
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strip the "console/" prefix so docker/metadata-action sees a clean semver tag
      # e.g. console/v1.2.3 → v1.2.3
      - name: Derive semver from tag
        id: tag
        run: |
          RAW="${{ github.ref_name }}"
          VERSION="${RAW#console/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push console runner
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ./services/console
          file: ./services/console/Dockerfile
          target: runner
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=console-runner
          cache-to: type=gha,mode=max,scope=console-runner

      - name: Extract metadata for console migrator
        id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/console-migrator
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push console migrator
        uses: docker/build-push-action@v6
        with:
          context: ./services/console
          file: ./services/console/Dockerfile
          target: migrator
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha,scope=console-migrator
          cache-to: type=gha,mode=max,scope=console-migrator

      - name: Write job summary
        run: |
          echo "### ✅ console published" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ steps.tag.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Digest** | \`${{ steps.build-push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platforms** | linux/amd64 |" >> "$GITHUB_STEP_SUMMARY"
