# ============================================================================
# PageX — Production Docker Compose
#
# Docker runs the blob-server (Caddy + static_s3) and the Vector access-log
# pipeline only. The console runs on Vercel (serverless); Postgres is Neon and
# Redis is Upstash. This file contains NO `build:` sections, so
# `docker compose -f docker-compose.prod.yml up -d` never builds locally.
#
# The blob-server image is published on blob-server/v* tags:
#   blob-server/v1.5.0
#
# Usage (from repo root):
#   cp .env.example .env        # first run, then fill in required values
#   pnpm docker:prod            # pull + up -d (default tag: latest)
#   PAGEX_VERSION=1.5.0 pnpm docker:prod   # pin a specific release
# ============================================================================

name: pagex-prod

services:
  # ============================================================================
  # Blob Server — Caddy with static_s3 Plugin
  # ============================================================================
  blob-server:
    image: ${PAGEX_REGISTRY:-ghcr.io/mahadi-rsio/pagex}/blob-server:${PAGEX_VERSION:-latest}
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/blob-server/tls:/etc/caddy/tls:ro
      - caddy_logs:/var/log/caddy
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_BUCKET=${MINIO_BUCKET:-sites}
      - BASE_DOMAIN=${BASE_DOMAIN:?BASE_DOMAIN is required}
      # Neon Postgres connection string. The static_s3 plugin only performs
      # read-only site lookups, so the pooled endpoint is fine.
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL (Neon) is required}
      # Upstash Redis (REST) durable routing lookup: subdomain → site_id and
      # site_id → active deployment. Must match the console's
      # UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN / REDIS_KEY_PREFIX.
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:?UPSTASH_REDIS_REST_URL is required}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:?UPSTASH_REDIS_REST_TOKEN is required}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-px}
      # Vercel deployment origin the console host blocks reverse-proxy to.
      - CONSOLE_UPSTREAM=${CONSOLE_UPSTREAM:?CONSOLE_UPSTREAM (Vercel URL) is required}
      - REDIRECT_TO_S3=${REDIRECT_TO_S3:-false}
      - PRESIGN_REDIRECT=${PRESIGN_REDIRECT:-false}
      - PRESIGN_LIFETIME=${PRESIGN_LIFETIME:-15m}
      - CACHE_TTL=${CACHE_TTL:-2m}
      - CACHE_SIZE=${CACHE_SIZE:-1000}
      - MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-512KiB}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - TLS_CFG=${TLS_CFG:-tls-off}
    restart: unless-stopped
    networks:
      - pagex

  # ============================================================================
  # Vector — access-log aggregation → console usage ingest
  # ============================================================================
  vector:
    image: timberio/vector:0.46.1-alpine
    container_name: vector
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./services/blob-server/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - caddy_logs:/var/log/caddy
      - vector_data:/var/lib/vector
    environment:
      - USAGE_INGEST_TOKEN=${USAGE_INGEST_TOKEN:?USAGE_INGEST_TOKEN is required}
      - USAGE_API_URL=${USAGE_API_URL:?USAGE_API_URL (console ingest URL) is required}
    depends_on:
      - blob-server
    restart: unless-stopped
    networks:
      - pagex

volumes:
  caddy_logs:
  vector_data:

networks:
  pagex:
    driver: bridge
